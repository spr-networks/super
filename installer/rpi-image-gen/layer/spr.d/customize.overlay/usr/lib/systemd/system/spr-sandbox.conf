# Each SPR service gets a private root with only its own paths in it,
# matching its Docker volumes (the NixOS module's sprServiceConfig): an
# empty read-only /, the system read-only, then the unit's own BindPaths.
[Service]
TemporaryFileSystem=/:ro
BindReadOnlyPaths=/usr /usr/bin:/bin /usr/sbin:/sbin /usr/lib:/lib /etc /run
BindReadOnlyPaths=/dev/null /dev/zero /dev/urandom /dev/random
PrivateDevices=yes
PrivateTmp=yes
# TemporaryFileSystem=/ leaves out /proc and /sys (the API reads
# /proc/net/arp, etc.); mount them like a container would
MountAPIVFS=yes
