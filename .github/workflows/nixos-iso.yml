name: NixOS ISO Installer

on:
  # after PI ISO Installer on main (itself after Docker Image CI, as the
  # other ISOs), which publishes the release's spr-krun-runtime .deb that
  # this image ships (fetch-images.sh)
  workflow_run:
    workflows: ["PI ISO Installer"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  build_iso:
    # native aarch64: everything but SPR's own packages comes from the binary
    # cache, no emulation or cross-compiling
    # armbuild1 has only this label (registered with --no-default-labels),
    # so jobs asking for plain self-hosted never land on it
    runs-on: spr-nixos-arm64
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      # a workflow_run run is on the default branch: build and release
      # what the triggering run built
      BUILD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: '0'
      - name: Fetch tags
        run:  git fetch --tags
      # tag names go into GITHUB_ENV, which sets variables for every later
      # step: take only one exact release version, never other tag text
      - name: Get version from git
        run: |
          version=$(git tag --contains "$(git rev-parse HEAD)" | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' || true)
          if [ "$(printf '%s' "$version" | grep -c .)" -gt 1 ]; then
            echo "more than one release version tag contains HEAD" >&2
            exit 1
          fi
          echo "RELEASE_VERSION_TAG=$version" >> "$GITHUB_ENV"
      # SPR's services come from the images Docker Image CI built from this
      # commit: the release's, or <version>-dev as it tags them on dev; krun
      # from the release (fetch-images.sh verifies each with cosign)
      - name: Build install image and system archive
        env:
          SYSTEM_ARCHIVE: "1"
          SPR_RELEASE_VERSION: ${{ env.RELEASE_VERSION_TAG }}
        run: |
          if [ -n "$RELEASE_VERSION_TAG" ]; then
            export SPR_IMAGE_TAG="${RELEASE_VERSION_TAG#v}"
          elif [ "$BUILD_BRANCH" = dev ]; then
            export SPR_IMAGE_TAG="$(git describe --tags --abbrev=0 | grep -Eo '[0-9]+\.[0-9]+.[0-9]+')-dev"
          fi
          ./installer/nixos/build-image.sh aarch64
      # in the Nix builder image, which wrote the output as root: the
      # runner needs neither apt nor sudo
      - name: Compress image
        run: |
          docker run --rm -v "$PWD/installer/nixos/output:/out" -w /out \
            -e NIX_CONFIG="experimental-features = nix-command flakes" \
            "$(sed -n 's/^NIX_REF=//p' reproducible.env)" \
            nix shell nixpkgs#zstd nixpkgs#xz -c sh -c \
            "zstd -dc nixos-image-*.img.zst | xz -T 0 -9 -z > spr-nixos.img.xz && chown -R $(id -u):$(id -g) /out"
      - name: Attest ISO Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "./installer/nixos/output/spr-nixos.img.xz"
          subject-name: "spr-nixos.img.xz"
      # devices update from this: superd verifies the attestation against
      # this workflow on main before it installs anything (sysupdate.go)
      - name: Attest System Archive Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "./installer/nixos/output/spr-nixos-system.tar"
          subject-name: "spr-nixos-system.tar"
      # after both attestations, so nothing is published unattested;
      # --target: a new tag on the commit built, as actions/create-release did
      - name: Create Release and Upload Images
        if: ${{ env.BUILD_BRANCH == 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : "${RELEASE_VERSION_TAG:?no release version tag contains HEAD}"
          gh release create "nixos-$RELEASE_VERSION_TAG" \
            --title "NixOS Release $RELEASE_VERSION_TAG" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            ./installer/nixos/output/spr-nixos.img.xz \
            ./installer/nixos/output/spr-nixos-system.tar
      - name: Remove image
        if: ${{ always() }}
        run: |
          [ ! -e ./installer/nixos/output ] || docker run --rm -v "$PWD/installer/nixos:/w" \
            "$(sed -n 's/^NIX_REF=//p' reproducible.env)" rm -rf /w/output
